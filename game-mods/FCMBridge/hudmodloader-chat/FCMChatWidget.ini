; Data/ZFE/TextChat/fragments/FCMChatWidget.ini
;
; ZFE TextChat fragment for FCMChatWidget.
; Filename MUST match the hudmodloader.ini entry (FCMChatWidget) exactly.
; ZFE reads Data/hudmodloader.ini and applies the first matching fragment found.
; Place this file at: Data/ZFE/TextChat/fragments/FCMChatWidget.ini
;
; USER OVERRIDE: any key here can be overridden per-key in:
;   Data/configuration/zfe.ini   [TextChat] section
; Values in zfe.ini win over fragment values.
;
; Valid ZFE OpenChatKey values include INSERT, DELETE, HOME, END, PAGE_DOWN
; (also PAGEDOWN or PGDN), and a single letter or digit. DELETE is a useful alternative
; when INSERT conflicts with another mod. Avoid PAGE_DOWN when you want Page Down to remain
; FCM's next-channel key.
; Note: this startup value is handled by ZFE natively (isChatKeyPressed). After widget discovery,
; FCMChat.ini openKey is synchronized to the watcher; xScal reads it through Input.* instead.
; Feed navigation bindings are also in Data/FCMChat.ini: channelNextKey=NextPage,
; channelPrevKey=PrevPage, scrollUpKey=Up, scrollDownKey=Down, while scrollBottomKey and
; hideKey are intentionally blank until selected. Do not add those keys to this [TextChat]
; fragment; feed bindings belong to FCMChat.ini.

[TextChat]
; Key ZFE uses for native hotkey detection (isChatKeyPressed).
; This is ZFE's pre-widget startup binding. Default INSERT matches the Text Chat mod default.
; If another mod owns that action, choose a non-channel key; PAGE_DOWN is reserved
; for the physical next-channel fallback in the widget build.
OpenChatKey=INSERT

; Default channel shown on connect (must be in AllowedChannels).
DefaultChannel=global

; Channels the widget may send/receive on (comma-separated, no spaces).
; "server" carries current-room chat and reserved world-session controls — keep it here.
AllowedChannels=global,trade,events,raids,infests,server

; Whether ZFE auto-connects when the SWF loads. The widget handles connect
; itself after BSUIDataManager is ready; set false to avoid a race.
AutoConnect=false

; The package helper stamps the target-specific relay endpoint. Users may override this key in
; Data/configuration/zfe.ini [TextChat].
; The endpoint path is /relay (not /zfe-relay).
Endpoint=wss://falloutchatmod.com/relay

; Exact-origin browser allowances requested for FCM (ZFE browser-v1).
; Discord: channels/events/invites. Fallout Builds: builds and Minerva guides.
; Fallout Wiki: articles. NukaCrypt: game data. Steam: profiles/community/store.
; Player rules override these defaults; this is not a deny-all-except policy.
; These defaults apply across supported ZFE mods and never authorize passive opening.
; Edit while Fallout 76 is closed. No wildcards, paths, queries, or non-443 ports.
[BrowserLinks.Sites]
https://discord.com=allow
https://discord.gg=allow
https://www.falloutbuilds.com=allow
https://falloutbuilds.com=allow
https://fallout.wiki=allow
https://nukacrypt.com=allow
https://steamcommunity.com=allow
https://store.steampowered.com=allow
