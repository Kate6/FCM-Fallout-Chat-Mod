; Data/ZFE/TextChat/fragments/FCMEventsWidget.ini
;
; PERSONAL VARIANT fragment for the Events-only widget build (build-events.hxml).
; NOT the shipped widget. Filename MUST match the hudmodloader.ini entry (FCMEventsWidget)
; exactly. ZFE reads Data/hudmodloader.ini and applies the first matching fragment found.
; Place this file at: Data/ZFE/TextChat/fragments/FCMEventsWidget.ini
; Install INSTEAD of FCMChatWidget — never alongside it.
;
; USER OVERRIDE: any key here can be overridden per-key in:
;   Data/configuration/zfe.ini   [TextChat] section
; Values in zfe.ini win over fragment values.
;
; The open key restores a hidden panel in this build; it never opens an editor
; (all user sends are compiled out — read-only feed apart from auto-broadcasts).

[TextChat]
; Key ZFE uses for native hotkey detection (isChatKeyPressed).
OpenChatKey=INSERT

; Default channel shown on connect (must be in AllowedChannels).
DefaultChannel=events

; Channels the widget may send/receive on (comma-separated, no spaces).
; Kept full: the world-session protocol still runs silently underneath the
; Events-only feed. The widget itself drops every non-Events row on ingest.
AllowedChannels=global,trade,events,raids,infests,server

; Whether ZFE auto-connects when the SWF loads. The widget handles connect
; itself after BSUIDataManager is ready; set false to avoid a race.
AutoConnect=false

; Prod relay endpoint (this variant is prod-only).
; Users may override this key in Data/configuration/zfe.ini [TextChat].
Endpoint=wss://falloutchatmod.com/relay

; Exact-origin browser allowances requested for FCM (ZFE browser-v1).
[BrowserLinks.Sites]
https://discord.com=allow
https://discord.gg=allow
https://www.falloutbuilds.com=allow
https://falloutbuilds.com=allow
https://fallout.wiki=allow
https://nukacrypt.com=allow
https://steamcommunity.com=allow
https://store.steampowered.com=allow
