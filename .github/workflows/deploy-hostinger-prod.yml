name: Deploy Hostinger Production

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: fcm-hostinger-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.HOSTINGER_PROD_AUTODEPLOY == 'true' }}
    runs-on: [self-hosted, Linux, X64, fcm-hostinger-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Build, deploy, verify, or roll back Hostinger Production
        run: >-
          bash .github/scripts/deploy-hostinger-prod.sh
          '${{ github.sha }}'
          /opt/fcm-cutover/prod
